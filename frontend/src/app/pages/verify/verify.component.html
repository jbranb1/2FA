<section class="center-card">
  <div class="authenticator-icon" aria-hidden="true"><span>6</span></div>
  <p class="eyebrow">Paso 2 · Factor de posesión</p>
  <h1>Código del autenticador</h1>
  <p class="lead">Abre Google Authenticator e introduce el código actual de seis dígitos.</p>
  <form class="code-form" (ngSubmit)="verify()">
    <label for="verify-code">Código TOTP</label>
    <input id="verify-code" class="otp-input" type="text" inputmode="numeric" maxlength="6"
      autocomplete="one-time-code" [formControl]="code" placeholder="000000" autofocus />
    @if (error()) { <p class="alert error" role="alert">{{ error() }}</p> }
    <button class="primary" type="submit" [disabled]="code.invalid || submitting()">
      {{ submitting() ? 'Verificando…' : 'Validar segundo factor' }}
    </button>
  </form>
  <p class="microcopy">Cada código dura 30 segundos y solo puede usarse una vez.</p>
  <a class="back-link" routerLink="/login">← Volver a las credenciales</a>
</section>
